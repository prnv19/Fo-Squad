# Fly.io config. Create the volume first: fly volumes create fo_squad_data --size 1
# Set the token as a secret: fly secrets set FO_SQUAD_TOKEN=<long random string>
app = "fo-squad"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[mounts]
  source = "fo_squad_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # One machine kept running: the store is a single volume and locks are in-process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
