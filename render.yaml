# Render Blueprint. A disk keeps events across deploys; it requires a paid instance type.
services:
  - type: web
    name: fo-squad
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: FO_SQUAD_TOKEN
        sync: false
    disk:
      name: fo-squad-data
      mountPath: /data
      sizeGB: 1
